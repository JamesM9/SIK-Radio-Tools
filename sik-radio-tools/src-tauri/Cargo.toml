[package]
name = "sik-radio-tools"
version = "1.0.1"
description = "Desktop SiK telemetry radio configurator"
authors = ["JamesM9"]
edition = "2021"

[lib]
name = "sik_radio_tools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
