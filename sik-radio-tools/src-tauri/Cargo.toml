[package]
name = "sik-radio-tools"
version = "1.0.1"
description = "SiK telemetry radio configurator (desktop + mobile)"
authors = ["JamesM9"]
edition = "2021"

[lib]
name = "sik_radio_tools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-serialplugin = "2"
tauri-plugin-os = "2.3.2"

# OS serial ports (Windows / macOS / Linux). Android uses USB Host via serialplugin.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
serialport = "4"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
