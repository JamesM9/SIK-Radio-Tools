# Build native installers for Windows, macOS, and Linux.
# - Manual: Actions → Build Desktop Installers → Run workflow
# - Tagged release: push a tag like v1.0.1 to attach installers to a GitHub Release

name: Build Desktop Installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-installers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            name: linux-x64
            rust_target: ''
            args: ''
          - platform: windows-latest
            name: windows-x64
            rust_target: ''
            args: ''
          - platform: macos-latest
            name: macos-arm64
            rust_target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            name: macos-x64
            rust_target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: sik-radio-tools/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS cross-compile target
        if: matrix.rust_target != ''
        run: rustup target add ${{ matrix.rust_target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libudev-dev \
            rpm

      - name: Install frontend dependencies
        working-directory: sik-radio-tools
        run: npm ci

      - name: Build desktop installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: sik-radio-tools
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: SiK Radio Tools ${{ github.ref_name }}
          releaseBody: |
            Desktop installers for Windows, macOS, and Linux.

            | Platform | Installer |
            |---|---|
            | Windows | NSIS `.exe` and `.msi` |
            | macOS | `.dmg` (Apple Silicon + Intel) |
            | Linux | `.deb`, `.rpm`, and `.AppImage` |

            The browser-based web app is unchanged and remains available via GitHub Pages.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          includeUpdaterJson: false

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sik-radio-tools-${{ matrix.name }}
          path: |
            sik-radio-tools/src-tauri/target/release/bundle/deb/*.deb
            sik-radio-tools/src-tauri/target/release/bundle/rpm/*.rpm
            sik-radio-tools/src-tauri/target/release/bundle/appimage/*.AppImage
            sik-radio-tools/src-tauri/target/release/bundle/dmg/*.dmg
            sik-radio-tools/src-tauri/target/release/bundle/macos/*.app
            sik-radio-tools/src-tauri/target/release/bundle/nsis/*.exe
            sik-radio-tools/src-tauri/target/release/bundle/msi/*.msi
            sik-radio-tools/src-tauri/target/*/release/bundle/deb/*.deb
            sik-radio-tools/src-tauri/target/*/release/bundle/rpm/*.rpm
            sik-radio-tools/src-tauri/target/*/release/bundle/appimage/*.AppImage
            sik-radio-tools/src-tauri/target/*/release/bundle/dmg/*.dmg
            sik-radio-tools/src-tauri/target/*/release/bundle/macos/*.app
            sik-radio-tools/src-tauri/target/*/release/bundle/nsis/*.exe
            sik-radio-tools/src-tauri/target/*/release/bundle/msi/*.msi
          if-no-files-found: warn
          retention-days: 30
