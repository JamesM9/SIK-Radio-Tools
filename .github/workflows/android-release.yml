name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sik-radio-tools
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: sik-radio-tools/package-lock.json

      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager "ndk;26.1.10909125"

      - name: Install npm deps
        run: npm ci

      - name: Init Android project + USB overlays
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
        run: |
          npx tauri android init --ci
          node scripts/prepare-android.js

      - name: Build Android APK
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
        run: npm run mobile:android:build

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sik-radio-tools-android
          path: |
            sik-radio-tools/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            sik-radio-tools/src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
